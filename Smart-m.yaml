proxy-providers:
  主线:
    url: 
    type: http
    interval: 3000
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
  备用:
    url: 
    type: http
    interval: 3000
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
    proxy: 直连
proxies:
  - name: 直连
    type: direct
  - name: 拒绝
    type: reject
port: 7892
socks-port: 7891
redir-port: 0
mixed-port: 7890
tproxy-port: 0
allow-lan: false
mode: rule
log-level: info
external-controller: 127.0.0.1:9090
secret: 
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - +.lan
    - +.local
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
    - geodata.cn
  use-hosts: false
  use-system-hosts: false
  respect-rules: false
  default-nameserver:
    - tls://223.5.5.5
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver: []
  fallback: []
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
ipv6: false
tun:
  enable: true
  stack: mixed
  device: Mihomo
  endpoint-independent-nat: true
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
  auto-redirect: false
  strict-route: true
  route-exclude-address: []
  mtu: 1500
profile:
  store-selected: true
  store-fake-ip: true
  smart-collector-size: 1024
default:
  type: select
  proxies:
    - 台湾-故转
    - 吃压力专用-智选
    - 台湾-智选
    - 所有-智选
    - 所有-手选
