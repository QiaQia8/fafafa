  - name: 吃压力专用-智选
    type: smart
    include-all: true
    policy-priority: 主线:1.2
    uselightgbm: true
    collectdata: true
    interval: 35
    filter: (?=.*(台湾 低时延)).*$
  - name: 不吃压力专用-智选
    type: smart
    include-all: true
    policy-priority: 主线:0.8
    uselightgbm: true
    collectdata: true
    interval: 300
    filter: (?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong|广日|日本|JP|川日|东京|大阪|泉日|埼玉|沪日|深日|🇯🇵|Japan|广新|新加坡|SG|坡|狮城|🇸🇬|Singapore)).*$
  - name: 所有-手选
    type: select
    include-all: true
    filter: ^((?!(直连|拒绝)).)*$
  - name: 所有-智选
    type: smart
    include-all: true
    policy-priority: 香港:1.2;主线:0.8
    uselightgbm: true
    collectdata: true
    interval: 300
    filter: ^((?!(直连|拒绝)).)*$
  - name: 香港-故转
    type: fallback
    interval: 300
    lazy: false
    proxies:
      - 香港-手选
      - 香港-智选
  - name: 香港-手选
    type: select
    include-all: true
    filter: (?=.*(广港|香港|HK|Hong Kong|🇭🇰|HongKong)).*$
